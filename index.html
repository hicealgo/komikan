<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Komikán — el pangui y los trewa</title>
  <meta name="description" content="Komikán: implementación digital y de código abierto del juego tradicional mapuche de estrategia. / An open-source digital version of the traditional Mapuche strategy game.">
  <script>
    // Set the theme before first paint so there is no light/dark flash.
    try {
      var s = JSON.parse(localStorage.getItem('komikan-settings-v1') || '{}');
      document.documentElement.dataset.theme = s.theme === 'dark' ? 'dark' : 'light';
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">KOMIKÁN</h1>
    <p class="app-subtitle" data-i18n="app.subtitle">el pangui y los trewa · juego mapuche de estrategia</p>
  </header>

  <main id="app">
    <section id="screen-menu" class="screen">
      <div class="menu-tools">
        <div class="seg" role="group" data-i18n-attr="aria-label:menu.lang" aria-label="Idioma">
          <button type="button" id="lang-es" class="seg-btn" lang="es">ES</button>
          <button type="button" id="lang-en" class="seg-btn" lang="en">EN</button>
        </div>
        <button type="button" id="btn-theme" class="seg-btn seg-solo"></button>
      </div>

      <div class="menu-card">
        <button id="btn-vs-human" class="btn btn-primary btn-block" data-i18n="menu.human">Dos jugadores (mismo dispositivo)</button>
        <button id="btn-vs-ai" class="btn btn-primary btn-block" data-i18n="menu.ai">Jugar contra la IA</button>

        <div id="ai-options" class="ai-options" hidden>
          <label class="field">
            <span data-i18n="menu.difficulty">Dificultad de la IA</span>
            <select id="select-difficulty">
              <option value="easy" data-i18n="menu.easy">Fácil</option>
              <option value="medium" data-i18n="menu.medium" selected>Media</option>
              <option value="hard" data-i18n="menu.hard">Difícil</option>
            </select>
          </label>
          <fieldset class="field-group">
            <legend data-i18n="menu.playAs">Quiero jugar como…</legend>
            <label><input type="radio" name="humanSide" value="puma" checked> <span data-i18n="menu.asPuma">Pangui (el puma, 1 ficha)</span></label>
            <label><input type="radio" name="humanSide" value="dog"> <span data-i18n="menu.asDog">Trewa (los perros, 12 fichas)</span></label>
          </fieldset>
          <button id="btn-start-ai" class="btn btn-accent btn-block" data-i18n="menu.start">Comenzar</button>
        </div>

        <button id="btn-tutorial" class="btn btn-ghost btn-block" data-i18n="menu.tutorial">Cómo se juega (tutorial)</button>
      </div>

      <div class="settings-row">
        <label class="switch"><input type="checkbox" id="toggle-share"> <span data-i18n="menu.share">Compartir mis partidas de forma anónima</span></label>
        <label class="switch"><input type="checkbox" id="toggle-hints"> <span data-i18n="menu.hints">Pistas (resaltar movimientos legales)</span></label>
      </div>

      <p class="menu-footnote" data-i18n="menu.footnote">
        Juego tradicional del pueblo mapuche, de código abierto, hecho con respeto para difundir ese patrimonio.
      </p>
      <p class="menu-links">
        <a data-doc="RULES" href="https://github.com/hicealgo/komikan/blob/main/docs/RULES.es.md" target="_blank" rel="noopener" data-i18n="menu.linkRules">Reglas y fuentes</a> ·
        <a data-doc="ARCHITECTURE" href="https://github.com/hicealgo/komikan/blob/main/docs/ARCHITECTURE.es.md" target="_blank" rel="noopener" data-i18n="menu.linkCode">Cómo funciona el código</a> ·
        <a href="https://github.com/hicealgo/komikan" target="_blank" rel="noopener" data-i18n="menu.linkRepo">Repositorio</a>
      </p>
    </section>

    <section id="screen-game" class="screen" hidden>
      <div class="hud">
        <div class="hud-turn" id="hud-turn"></div>
        <div class="hud-stats">
          <span data-i18n-attr="title:hud.eatenTitle"><span data-i18n="hud.eaten">comidos:</span> <strong id="hud-captured">0</strong></span>
          <span data-i18n-attr="title:hud.leftTitle"><span data-i18n="hud.left">quedan:</span> <strong id="hud-remaining">12</strong></span>
        </div>
        <div class="hud-actions">
          <button id="btn-end-turn" class="btn btn-accent" data-i18n="hud.endChain" hidden>Terminar salto</button>
          <button id="btn-restart" class="btn btn-ghost" data-i18n="hud.restart">Reiniciar</button>
          <button id="btn-menu" class="btn btn-ghost" data-i18n="hud.menu">Menú</button>
        </div>
      </div>

      <div class="board-wrap">
        <svg id="board" class="board-svg" role="img" data-i18n-attr="aria-label:board.label"></svg>
      </div>
    </section>
  </main>

  <div id="banner-winner" class="banner" hidden>
    <div class="banner-card">
      <p id="banner-text"></p>
      <div class="banner-actions">
        <button id="btn-play-again" class="btn btn-primary" data-i18n="win.again">Jugar otra vez</button>
        <button id="btn-back-to-menu" class="btn btn-ghost" data-i18n="win.toMenu">Volver al menú</button>
      </div>
    </div>
  </div>

  <div id="tutorial-overlay" class="tutorial-overlay" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
